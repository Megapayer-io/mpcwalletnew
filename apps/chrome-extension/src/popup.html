<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPC Wallet</title>
    <style>
        body {
            width: 400px;
            height: 600px;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f9fafb;
        }
        
        .header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px;
            text-align: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        
        .logo-text h1 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
            color: #111827;
        }
        
        .logo-text p {
            margin: 0;
            font-size: 14px;
            color: #6b7280;
        }
        
        .main-content {
            padding: 24px;
        }
        
        .wallet-status {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        
        .wallet-status h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            font-weight: 600;
            color: #111827;
        }
        
        .wallet-status p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }
        
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            color: #374151;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .action-btn:hover {
            border-color: #3b82f6;
            background: #f8fafc;
        }
        
        .primary-btn {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        
        .primary-btn:hover {
            background: #2563eb;
            border-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">💳</div>
            <div class="logo-text">
                <h1>MPC Wallet</h1>
                <p>Professional Web3 Wallet</p>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="wallet-status">
            <h3>Wallet Status</h3>
            <p id="wallet-status-text">Checking wallet status...</p>
        </div>
        
        <div class="action-buttons">
            <button class="action-btn primary-btn" id="unlock-btn" style="display: none;">Unlock Wallet</button>
            <button class="action-btn" id="send-btn" style="display: none;">Send</button>
            <button class="action-btn" id="receive-btn" style="display: none;">Receive</button>
            <button class="action-btn" id="settings-btn" style="display: none;">Settings</button>
            <button class="action-btn primary-btn" id="setup-btn">Setup Wallet</button>
        </div>
    </div>

    <script src="wallet-service.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const statusText = document.getElementById('wallet-status-text');
            const unlockBtn = document.getElementById('unlock-btn');
            const sendBtn = document.getElementById('send-btn');
            const receiveBtn = document.getElementById('receive-btn');
            const settingsBtn = document.getElementById('settings-btn');
            const setupBtn = document.getElementById('setup-btn');
            
            // Check wallet status
            async function checkWalletStatus() {
                try {
                    if (window.walletService.isWalletUnlocked()) {
                        statusText.textContent = 'Wallet is unlocked';
                        unlockBtn.style.display = 'none';
                        sendBtn.style.display = 'block';
                        receiveBtn.style.display = 'block';
                        settingsBtn.style.display = 'block';
                        setupBtn.style.display = 'none';
                    } else {
                        statusText.textContent = 'Wallet is locked';
                        unlockBtn.style.display = 'block';
                        sendBtn.style.display = 'none';
                        receiveBtn.style.display = 'none';
                        settingsBtn.style.display = 'none';
                        setupBtn.style.display = 'block';
                    }
                } catch (error) {
                    statusText.textContent = 'No wallet found';
                    setupBtn.style.display = 'block';
                }
            }
            
            // Setup button
            setupBtn.addEventListener('click', function() {
                window.location.href = 'setup.html';
            });
            
            // Unlock button
            unlockBtn.addEventListener('click', function() {
                const password = prompt('Enter your password:');
                if (password) {
                    window.walletService.unlockWallet(password).then(result => {
                        if (result.success) {
                            checkWalletStatus();
                        } else {
                            alert('Failed to unlock wallet: ' + result.error);
                        }
                    });
                }
            });
            
            // Initialize
            checkWalletStatus();
        });
    </script>
</body>
</html>
