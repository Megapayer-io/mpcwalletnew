<!DOCTYPE html>
<html>
<head>
    <title>Clear Wallet localStorage</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Clear Wallet localStorage Data</h1>
    
    <button onclick="showData()">Show Current Data</button>
    <button onclick="clearAllData()">Clear All Wallet Data</button>
    <button onclick="clearAccountsOnly()">Clear Accounts Only</button>
    
    <div id="output"></div>

    <script>
        function showData() {
            const keys = [
                'evm-wallet-keystore',
                'evm-wallet-state', 
                'evm-wallet-accounts',
                'evm-wallet-networks'
            ];
            
            let output = '<h3>Current localStorage Data:</h3>';
            
            keys.forEach(key => {
                const data = localStorage.getItem(key);
                if (data) {
                    try {
                        const parsed = JSON.parse(data);
                        output += `<h4>${key}:</h4><pre>${JSON.stringify(parsed, null, 2)}</pre>`;
                    } catch (e) {
                        output += `<h4>${key} (raw):</h4><pre>${data}</pre>`;
                    }
                } else {
                    output += `<p><strong>${key}:</strong> Not found</p>`;
                }
            });
            
            document.getElementById('output').innerHTML = output;
        }

        function clearAllData() {
            const keys = [
                'evm-wallet-keystore',
                'evm-wallet-state', 
                'evm-wallet-accounts',
                'evm-wallet-networks'
            ];
            
            keys.forEach(key => {
                localStorage.removeItem(key);
            });
            
            document.getElementById('output').innerHTML = 
                '<p class="success">✅ All wallet data cleared! Refresh your wallet app now.</p>';
        }

        function clearAccountsOnly() {
            // Clear accounts data
            localStorage.removeItem('evm-wallet-accounts');
            
            // Reset accounts in state
            const stateData = localStorage.getItem('evm-wallet-state');
            if (stateData) {
                try {
                    const state = JSON.parse(stateData);
                    state.accounts = [];
                    state.currentAccount = undefined;
                    localStorage.setItem('evm-wallet-state', JSON.stringify(state));
                } catch (e) {
                    console.error('Failed to update state:', e);
                }
            }
            
            document.getElementById('output').innerHTML = 
                '<p class="success">✅ Corrupted accounts cleared! Keystore and networks preserved.</p>';
        }

        // Show data on load
        window.onload = showData;
    </script>
</body>
</html>
